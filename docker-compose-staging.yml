networks:
  proxy:
    external: true
  db_wineacadamy_staging:
    internal: true

volumes:
  db_staging_data:
  uploads_staging_data:

services:
  db_wineacadamy_staging:
    image: postgres:15
    container_name: db_wineacadamy_staging
    env_file:
      - .env.staging
    volumes:
      - db_staging_data:/var/lib/postgresql/data
    networks:
      - db_wineacadamy_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      monitor.category: "database"
      monitor.project: "wineacadamy_staging"

  service_wineacadamy_staging:
    build:
      context: ./backend
    container_name: service_wineacadamy_staging
    command: ["npm", "run", "start"]
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_HOST=db_wineacadamy_staging
      - DATABASE_PORT=5432
    depends_on:
      db_wineacadamy_staging:
        condition: service_healthy
    volumes:
      - uploads_staging_data:/app/public/uploads
    user: "1000:1000"
    group_add:
      - "0"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/.cache:rw,nosuid,nodev,size=64m
      - /app/.tmp:rw,nosuid,nodev,size=64m
      - /home/node/.config:rw,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - db_wineacadamy_staging
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.services.service_wineacadamy_staging.loadbalancer.server.port: "1337"
      traefik.http.routers.service_wineacadamy_staging.rule: "(Host(`staging.wineacademy.de`) || Host(`wineacademy.plan-p.de`)) && PathPrefix(`/api`)"
      traefik.http.routers.service_wineacadamy_staging.entrypoints: "websecure"
      traefik.http.routers.service_wineacadamy_staging.tls.certresolver: "http-resolver"
      traefik.http.routers.service_wineacadamy_staging.priority: "100"
      # Admin/Plugin-APIs (JSON-Endpunkte für das Admin-Panel)
      traefik.http.routers.service_wineacadamy_staging-adminapi.rule: "(Host(`staging.wineacademy.de`) || Host(`wineacademy.plan-p.de`)) && (PathPrefix(`/content-manager`) || PathPrefix(`/content-type-builder`) || PathPrefix(`/i18n`) || PathPrefix(`/users-permissions`) || PathPrefix(`/email`) || PathPrefix(`/upload`) || PathPrefix(`/users`))"
      traefik.http.routers.service_wineacadamy_staging-adminapi.entrypoints: "websecure"
      traefik.http.routers.service_wineacadamy_staging-adminapi.tls.certresolver: "http-resolver"
      # Serve uploads without /api prefix for frontend asset URLs
      traefik.http.routers.service_wineacadamy_staging-uploads.rule: "(Host(`staging.wineacademy.de`) || Host(`wineacademy.plan-p.de`)) && PathPrefix(`/uploads`)"
      traefik.http.routers.service_wineacadamy_staging-uploads.entrypoints: "websecure"
      traefik.http.routers.service_wineacadamy_staging-uploads.tls.certresolver: "http-resolver"
      # Serve Strapi Admin under /admin (no strip)
      traefik.http.routers.service_wineacadamy_staging-admin.rule: "(Host(`staging.wineacademy.de`) || Host(`wineacademy.plan-p.de`)) && PathPrefix(`/admin`)"
      traefik.http.routers.service_wineacadamy_staging-admin.entrypoints: "websecure"
      traefik.http.routers.service_wineacadamy_staging-admin.tls.certresolver: "http-resolver"
      monitor.category: "website"
      monitor.project: "wineacadamy_staging"

  web_wineacadamy_staging:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://staging.wineacademy.de/api
        API_INTERNAL_URL: http://service_wineacadamy_staging:1337/api
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
        NEXT_PUBLIC_PAYPAL_CURRENCY: ${NEXT_PUBLIC_PAYPAL_CURRENCY:-EUR}
    container_name: web_wineacadamy_staging
    env_file:
      - .env.staging
    environment:
      - PORT=3000
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/.next/cache:rw,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.services.web_wineacadamy_staging.loadbalancer.server.port: "3000"
      traefik.http.routers.web_wineacadamy_staging.rule: '(Host(`staging.wineacademy.de`) || Host(`wineacademy.plan-p.de`)) && !PathRegexp(`(?i)^/.*\.(?:php|phtml|phar)$`)'
      traefik.http.routers.web_wineacadamy_staging.entrypoints: "websecure"
      traefik.http.routers.web_wineacadamy_staging.tls.certresolver: "http-resolver"
      traefik.http.routers.web_wineacadamy_staging.priority: "1"
      monitor.category: "website"
      monitor.project: "wineacadamy_staging"

networks:
  proxy:
    external: true
  db:
    internal: true

volumes:
  db_data:
  uploads_data:

services:
  db_wineacadamy:
    image: postgres:15
    container_name: db_wineacadamy
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      monitor.category: "database"
      monitor.project: "wineacadamy"

  service_wineacadamy:
    build:
      context: ./backend
    container_name: service_wineacadamy
    command: ["npm", "run", "start"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_HOST=db_wineacadamy
      - DATABASE_PORT=5432
    depends_on:
      db_wineacadamy:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - db
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.services.service_wineacadamy.loadbalancer.server.port: "1337"
      traefik.http.routers.service_wineacadamy.rule: "Host(`wineacademymain.plan-p.de`) && PathPrefix(`/api`)"
      traefik.http.routers.service_wineacadamy.entrypoints: "websecure"
      traefik.http.routers.service_wineacadamy.tls.certresolver: "http-resolver"
      traefik.http.routers.service_wineacadamy.priority: "100"
      # Serve uploads without /api prefix for frontend asset URLs
      traefik.http.routers.service_wineacadamy-uploads.rule: "Host(`wineacademymain.plan-p.de`) && PathPrefix(`/uploads`)"
      traefik.http.routers.service_wineacadamy-uploads.entrypoints: "websecure"
      traefik.http.routers.service_wineacadamy-uploads.tls.certresolver: "http-resolver"
      traefik.http.routers.service_wineacadamy-uploads.priority: "100"
      # Admin/Plugin APIs used by the Strapi admin
      traefik.http.routers.service_wineacadamy-adminapi.rule: "Host(`wineacademymain.plan-p.de`) && (PathPrefix(`/content-manager`) || PathPrefix(`/content-type-builder`) || PathPrefix(`/i18n`) || PathPrefix(`/users-permissions`) || PathPrefix(`/email`) || PathPrefix(`/upload`) || PathPrefix(`/users`))"
      traefik.http.routers.service_wineacadamy-adminapi.entrypoints: "websecure"
      traefik.http.routers.service_wineacadamy-adminapi.tls.certresolver: "http-resolver"
      traefik.http.routers.service_wineacadamy-adminapi.priority: "100"
      # Serve Strapi Admin under /admin (no strip)
      traefik.http.routers.service_wineacadamy-admin.rule: "Host(`wineacademymain.plan-p.de`) && PathPrefix(`/admin`)"
      traefik.http.routers.service_wineacadamy-admin.entrypoints: "websecure"
      traefik.http.routers.service_wineacadamy-admin.tls.certresolver: "http-resolver"
      traefik.http.routers.service_wineacadamy-admin.priority: "100"
      monitor.category: "website"
      monitor.project: "wineacadamy"

  web_wineacadamy:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        API_INTERNAL_URL: ${API_INTERNAL_URL}
    container_name: web_wineacadamy
    env_file:
      - .env
    environment:
      - PORT=3000
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.services.web_wineacadamy.loadbalancer.server.port: "3000"
      traefik.http.routers.web_wineacadamy.rule: "Host(`wineacademymain.plan-p.de`)"
      traefik.http.routers.web_wineacadamy.entrypoints: "websecure"
      traefik.http.routers.web_wineacadamy.tls.certresolver: "http-resolver"
      traefik.http.routers.web_wineacadamy.priority: "1"
      monitor.category: "website"
      monitor.project: "wineacadamy"
